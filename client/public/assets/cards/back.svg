<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='2000' viewBox='0 0 700 1000'>
  <defs>
    <filter id='grain'><feTurbulence baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter>
    <linearGradient id='g' x1='0' x2='1' y1='0' y2='1'>
      <stop offset='0' stop-color='#0b0b0b'/>
      <stop offset='1' stop-color='#141414'/>
    </linearGradient>
  </defs>
  <rect width='100%' height='100%' fill='url(#g)' rx='36' />
